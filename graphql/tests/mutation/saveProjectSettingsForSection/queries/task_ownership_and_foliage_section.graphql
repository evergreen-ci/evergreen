mutation {
  saveProjectSettingsForSection(
    projectSettings: {
      projectId: "sandbox_project_id"
      projectRef: {
        id: "sandbox_project_id"
        taskOwnership: {
          defaultMothraTeam: "my-team"
          defaultMothraTeamForBreakingCommit: "breaking-team"
        }
      }
    }
    section: TASK_OWNERSHIP_AND_FOLIAGE
  ) {
    projectRef {
      id
      taskOwnership {
        defaultMothraTeam
        defaultMothraTeamForBreakingCommit
      }
    }
  }
}
