type Volume {
  id: String!
  availabilityZone: String!
  createdBy: String!
  creationTime: Time
  displayName: String!
  expiration: Time
  homeVolume: Boolean!
  host: Host
  hostID: String! @deprecated(reason: "Use host.id instead")
  migrating: Boolean!
  noExpiration: Boolean!
  size: Int!
  type: String!
}
