###### TYPES ######
"""
Annotation models the metadata that a user can add to a task.
It is used as a field within the Task type.
"""
type Annotation {
  id: String!
  createdIssues: [IssueLink!]
  issues: [IssueLink!]
  note: Note
  suspectedIssues: [IssueLink!]
  metadataLinks: [MetadataLink!]
  taskId: String!
  taskExecution: Int!
  webhookConfigured: Boolean!
}

type Note {
  message: String!
  source: Source!
}

type Source {
  author: String!
  requester: String!
  time: Time!
}

type SearchReturnInfo {
  issues: [JiraTicket!]!
  search: String!
  source: String!
}

type JiraTicket {
  fields: TicketFields!
  key: String!
}
